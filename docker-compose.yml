services:
  postgres:
    image: postgres:17
    container_name: trip-management-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: trips
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_create_trips.up.sql:/docker-entrypoint-initdb.d/001_create_trips.sql:ro
volumes:
  postgres_data:
